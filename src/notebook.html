<!DOCTYPE html>
<html lang="zh">
<head>
<script src="mistakes.js"></script>
<script src="srs.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生词本</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --soft:#6b7280; --line:#e5e7eb; --accent:#2563eb; --accent2:#0ea5a4; --good:#16a34a; --bad:#dc2626; --chip:#eef2ff; --track:#eef0f3; --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05); }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0f1320; --card:#171c2b; --ink:#e8ecf3; --soft:#9aa3b2; --line:#262d40; --accent:#5b8cff; --accent2:#2dd4bf; --good:#34d399; --bad:#f87171; --chip:#1e2740; --track:#222a3d; --shadow:0 1px 3px rgba(0,0,0,.4); } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:30px 18px 60px}
  h1{margin:0 0 3px;font-size:23px}
  .sub{color:var(--soft);font-size:12.5px;margin:0 0 18px}
  .addbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5}
  .row{display:flex;gap:8px;align-items:center}
  input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:38px}
  .btn{border:none;border-radius:9px;padding:9px 14px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .ghosti{background:transparent;border:none;cursor:pointer;color:var(--soft);font-size:17px;padding:2px 5px}
  .hint{font-size:11.5px;color:var(--soft);margin-top:7px}
  .prev{margin-top:11px;border-top:1px dashed var(--line);padding-top:11px;display:none}
  .prev.show{display:block}
  .ph{color:var(--accent2);font-size:13px}
  .tools{display:flex;gap:8px;align-items:center;margin:18px 2px 10px;flex-wrap:wrap}
  .tools .count{color:var(--soft);font-size:12.5px;margin-right:auto}
  .search{flex:1;min-width:140px}
  .catpractice{width:100%;display:grid;gap:7px;margin-top:2px;padding-top:10px;border-top:1px solid var(--line)}
  .cprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .cptitle{width:94px;flex:0 0 94px;font-size:12px;font-weight:650;color:var(--soft)}
  .cprow .btn{flex:1}
  @media(max-width:480px){.cptitle{width:100%;flex-basis:100%}.cprow .btn{padding:6px 6px;min-width:calc(33% - 6px)}}
  .item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px}
  .item .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .item .w{font-size:17px;font-weight:650}
  .item .meta{margin-left:auto;display:flex;gap:4px;align-items:center}
  .tr{margin:7px 0 0;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .tr[contenteditable]:focus{outline:1px solid var(--accent);border-radius:6px;padding:2px 4px}
  .exrow{margin-top:7px}
  .ex{font-size:12.5px;color:var(--soft)}
  .tag{display:inline-block;background:var(--chip);color:var(--accent);font-size:11px;padding:1px 8px;border-radius:999px}
  .pos{display:inline-block;background:var(--chip);color:var(--accent);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.3px;white-space:nowrap;vertical-align:middle}
  .lwtag{display:inline-block;background:rgba(14,165,164,.14);color:var(--accent2);font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.lw.on{color:var(--accent2)}
  .btn.sm.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .lwtoggle{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--ink);cursor:pointer;user-select:none}
  .lwtoggle input{width:auto;accent-color:var(--accent2)}
  .rwtag{display:inline-block;background:rgba(139,92,246,.16);color:#8b5cf6;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.rw.on{color:#8b5cf6}
  .rwtoggle input{accent-color:#8b5cf6}
  .wwtag{display:inline-block;background:rgba(245,158,11,.16);color:#d97706;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.ww.on{color:#d97706}
  .wwtoggle input{accent-color:#d97706}
  .swtag{display:inline-block;background:rgba(236,72,153,.14);color:#db2777;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.sw.on{color:#db2777}
  .swtoggle input{accent-color:#db2777}
  .need{color:var(--bad);font-size:11.5px}
  .old{margin:0 0 9px;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--good) 9%,var(--card));border:1px solid color-mix(in srgb,var(--good) 35%,var(--line));font-size:13px;line-height:1.55}
  .old .oh{font-weight:650;color:var(--good)}
  .old .otr{white-space:pre-wrap;margin-top:3px}
  .old .oex{color:var(--soft);font-size:12.5px;margin-top:2px}
  .en{margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--soft)}
  .en .enl{display:block}
  .en .enp{font-style:italic;color:var(--accent2);margin-right:4px}
  .en summary{cursor:pointer;list-style:none;color:var(--accent);font-size:12px}
  .en summary::-webkit-details-marker{display:none}
  .sug{margin-top:7px;font-size:12px;color:var(--soft);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .sugw{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}
  .sugw:hover{border-color:var(--accent)}
  .item.flash{outline:2px solid var(--good);outline-offset:1px}
  [hidden]{display:none!important}
  @media (max-height:700px){ .addbox{position:static} }
  .empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:13px}
  /* review overlay */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .ov.show{display:flex}
  .rc{background:var(--card);border-radius:18px;padding:26px 22px;width:min(440px,90vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .rc .rw{font-size:30px;font-weight:700;margin:6px 0}
  .rc .rph{color:var(--accent2);font-size:15px;min-height:18px}
  .rc .rtr{margin:16px 0;font-size:15px;line-height:1.6;white-space:pre-wrap;min-height:40px;color:var(--ink)}
  .rc .rtr.hidden{filter:blur(7px)}
  .rc .nav{display:flex;gap:8px;justify-content:center;margin-top:18px}
  .rc .prog{color:var(--soft);font-size:12px;margin-top:12px}
  .mcchoices{display:grid;gap:9px;margin-top:18px;text-align:left}
  .mcopt{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;line-height:1.45;cursor:pointer}
  .mcopt:hover{border-color:var(--accent)}
  .mcopt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card));color:var(--good)}
  .mcopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad)}
  .mcopt:disabled{cursor:default}
  /* 写作 / 口语 production drills */
  .xcloze{font-size:19px;line-height:1.7;margin:14px 0 6px}
  .xcloze .gap{display:inline-block;min-width:72px;border-bottom:2px solid var(--accent);margin:0 4px}
  .xmean{color:var(--soft);font-size:14px;margin-top:8px;line-height:1.55;white-space:pre-wrap}
  .xmean.big{color:var(--ink);font-size:17px;margin:14px 0 4px}
  .xq{margin:14px 0 4px;font-size:15px;line-height:1.6;text-align:left;background:var(--bg);border-radius:10px;padding:10px 12px}
  .xtip{font-size:12.5px;color:var(--soft);margin-top:8px;line-height:1.5}
  .xsent{font-size:17px;line-height:1.6;margin:12px 0;transition:filter .2s}
  .xsent.hidden{filter:blur(6px)}
  .xref{font-size:13px;color:var(--soft);margin-top:8px;line-height:1.55;text-align:left}
body{overscroll-behavior-y:contain}
button{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div class="wrap">
  <h1>📒 生词本</h1>
  <p class="sub">练习里遇到不会的词，敲进来回车即可 —— 自动配上音标、中文释义和发音（离线词典 5.8 万词）。数据存本地。</p>

  <div class="addbox">
    <div class="row">
      <input id="w" placeholder="输入生词，回车添加（如 mitigate）" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <button class="btn" id="add">添加</button>
    </div>
    <div class="sug" id="psug" hidden></div>
    <div class="prev" id="prev">
      <div class="row" style="gap:10px"><b id="pw"></b><span class="ph" id="pph"></span><span id="pemo" style="font-size:22px"></span><button class="ghosti" id="psay" title="朗读">🔊</button></div>
      <div class="old" id="pold" hidden></div>
      <textarea id="ptr" placeholder="中文释义（自动填入，可改）"></textarea>
      <div class="en" id="pen" hidden></div>
      <div class="row" style="margin-top:7px"><input id="pex" placeholder="例句 / 语境（可选）" title="搭配填空会挖掉句中的这个词（含 stopped、went 等变形）；想指定挖哪里，用方括号括起来，如 He [went] abroad."></div>
      <div class="row" style="margin-top:7px"><input id="ptag" placeholder="来源 / 标签，如 C18T2 听力（可选）"></div>
    </div>
    <div class="hint" id="hint">提示：直接回车＝查词典并加入；词典没有的词也会加入，自己补释义即可。</div>
    <label class="lwtoggle"><input type="checkbox" id="plw"> 🎧 标记为「听力错词」——雅思听力里听错 / 拼错的词，可单独听写</label>
    <label class="lwtoggle rwtoggle"><input type="checkbox" id="prw"> 📖 标记为「阅读错词」——雅思阅读里不认识 / 弄错的词，可单独听写</label>
    <label class="lwtoggle wwtoggle"><input type="checkbox" id="pww"> 📝 标记为「写作生词」——雅思写作需要积累 / 运用的词</label>
    <label class="lwtoggle swtoggle"><input type="checkbox" id="psw"> 🗣️ 标记为「口语生词」——雅思口语需要积累 / 运用的词</label>
  </div>

  <p class="sub">练习进度自动保存；中途退出后，再点原来的练习入口即可接着上次继续。每个词会记录下次复习日：听写、选择题会先出到期的词，答错的词隔几题重测。</p>
  <div class="tools">
    <span class="count" id="count"></span>
    <input class="search" id="search" placeholder="🔎 搜索生词 / 释义">
    <button class="btn alt sm" id="onlyLW" title="只看听力错词">🎧 听力错词</button>
    <button class="btn alt sm" id="onlyRW" title="只看阅读错词">📖 阅读错词</button>
    <button class="btn alt sm" id="onlyWW" title="只看写作生词">📝 写作生词</button>
    <button class="btn alt sm" id="onlySW" title="只看口语生词">🗣️ 口语生词</button>
    <button class="btn alt sm" id="dictate">✍️ 听写</button>
    <button class="btn alt sm" id="review">🎴 复习</button>
    <button class="btn alt sm" id="edefGo" title="看英文释义，选出或写出单词" onclick="location.href='edef.html'">🧩 英义猜词</button>
    <button class="btn alt sm" id="export">⬇️ 导出</button>
    <button class="btn sm" id="upgradeTr" hidden title="只更新还是词典原文的释义；你自己改过的不动">📚 补全释义</button>
    <div class="catpractice" aria-label="分类专项练习">
      <div class="cprow"><span class="cptitle">🎧 听力错词</span><button class="btn alt sm" id="dictateLW" title="只听写标记为听力错词的词">听写</button></div>
      <div class="cprow"><span class="cptitle">📖 阅读错词</span><button class="btn alt sm" id="dictateRW">听写</button><button class="btn alt sm" id="reviewRW">意思抽查</button><button class="btn alt sm" id="quizRW">选择题</button></div>
      <div class="cprow"><span class="cptitle">📝 写作生词</span><button class="btn alt sm" id="dictateWW">听写</button><button class="btn alt sm" id="reviewWW">意思抽查</button><button class="btn alt sm" id="quizWW">选择题</button><button class="btn alt sm" id="xwcloze" title="在你记下的例句 / 搭配里挖空，写出这个词">搭配填空</button><button class="btn alt sm" id="xwprompt" title="看中文意思，写出英文表达">看中文写</button></div>
      <div class="cprow"><span class="cptitle">🗣️ 口语生词</span><button class="btn alt sm" id="dictateSW">听写</button><button class="btn alt sm" id="reviewSW">意思抽查</button><button class="btn alt sm" id="quizSW">选择题</button><button class="btn alt sm" id="xsprompt" title="按口语题情境，开口说一句用上这个词的话">情境说句</button><button class="btn alt sm" id="xsrepeat" title="听一句话，跟着复述，录音回放对比">短句复述</button></div>
    </div>
  </div>

  <div id="list"></div>
</div>

<div class="ov" id="ov">
  <div class="rc">
    <div id="remo" style="font-size:46px;min-height:52px;line-height:1"></div>
    <div class="rph" id="rph"></div>
    <div class="rw" id="rw"></div>
    <button class="btn alt sm" id="rsay">🔊 朗读</button>
    <div class="rtr hidden" id="rtr"></div>
    <button class="btn" id="rflip" style="margin-top:6px">显示释义</button>
    <div class="nav">
      <button class="btn alt" id="rprev">‹ 上一个</button>
      <button class="btn alt" id="rshuffle">🔀 打乱</button>
      <button class="btn alt" id="rnext">下一个 ›</button>
    </div>
    <div class="prog" id="rprog"></div>
    <button class="btn alt sm" id="rrestart" title="保留历史记录">↺ 从头重做</button>
    <button class="ghosti" id="rclose" style="margin-top:8px">关闭</button>
  </div>
</div>

<div class="ov" id="mov">
  <div class="rc">
    <div class="prog" id="mprog"></div>
    <div class="rph" id="mph"></div>
    <div class="rw" id="mword"></div>
    <button class="btn alt sm" id="msay">🔊 朗读</button>
    <div class="mcchoices" id="mchoices"></div>
    <div id="mfb" style="min-height:24px;margin-top:12px;font-size:14px;line-height:1.5"></div>
    <button class="btn" id="mnext" style="display:none;margin-top:10px">下一题 ›</button>
    <div class="prog" id="mscore"></div>
    <button class="btn alt sm" id="mrestart" title="保留历史记录">↺ 从头重做</button>
    <button class="ghosti" id="mclose" style="margin-top:8px">结束</button>
  </div>
</div>

<div class="ov" id="dov">
  <div class="rc">
    <div class="prog" id="dprog"></div>
    <div class="rtr" id="dtr" style="filter:none">提交答案后显示中文意思</div>
    <button class="btn alt sm" id="dsay">🔊 再听一次</button>
    <div class="row" style="margin-top:14px"><input id="dans" placeholder="听写：输入英文拼写" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    <div id="dfb" style="min-height:24px;margin-top:10px;font-size:15px"></div>
    <div class="nav"><button class="btn" id="dsubmit" data-base="提交">提交 (Enter)</button><button class="btn alt" id="dskip">跳过 ›</button></div>
    <div class="prog" id="dscore"></div>
    <button class="btn alt sm" id="drestart" title="保留历史记录">↺ 从头重做</button>
    <button class="ghosti" id="dclose" style="margin-top:8px">结束</button>
  </div>
</div>

<div class="ov" id="xov">
  <div class="rc">
    <div class="prog" id="xprog"></div>
    <div id="xbody"></div>
    <div class="row" id="xinrow" style="margin-top:14px"><input id="xans" placeholder="写出英文" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    <div class="nav" id="xrec" style="flex-wrap:wrap">
      <button class="btn alt sm" id="xrecbtn">🎙️ 录音</button>
      <button class="btn alt sm" id="xplay" disabled>▶ 听我的录音</button>
      <button class="btn alt sm" id="xsay">🔊 原音</button>
    </div>
    <div class="xtip" id="xrecnote"></div>
    <div id="xfb" style="min-height:24px;margin-top:10px;font-size:14.5px;line-height:1.55"></div>
    <div class="nav">
      <button class="btn" id="xsubmit" data-base="提交">提交 (Enter)</button>
      <button class="btn" id="xok" hidden>✓ 说出来了</button>
      <button class="btn alt" id="xbad" hidden>✗ 卡住了</button>
      <button class="btn alt" id="xnext">跳过 ›</button>
    </div>
    <div class="prog" id="xscore"></div>
    <button class="ghosti" id="xclose" style="margin-top:8px">结束</button>
  </div>
</div>

<script src="dict.js"></script>
<script src="defs.js"></script>
<script src="emoji.js"></script>
<script src="images.js"></script>
<script>
  var $=function(id){return document.getElementById(id);};
  // Submit-button hint follows the user's shortcut settings (shortcuts.js); without
  // it (phone/PWA) the page's own Enter handler applies. A cleared binding shows no key.
  function submitHint(){ var S=window.IELTSShortcuts; if(!S) return ' (Enter)'; var k=S.label('submit'); return k?' ('+k+')':''; }
  function setSubmit(text){ var b=$('dsubmit'); if(!b) return; b.dataset.base=text; b.textContent=text+submitHint(); }
  window.addEventListener('ielts:shortcuts',function(){ ['dsubmit','xsubmit'].forEach(function(id){ var b=$(id); if(b) b.textContent=(b.dataset.base||'提交')+submitHint(); }); });
  setSubmit('提交');
  var DICT=window.DICT||{};
  // Review ledger (srs.js), shared with the decks. The stub only keeps practice usable
  // if that script failed to load; it schedules nothing.
  var RV=window.IELTSReview||{live:false,
    grade:function(typed,alts){ var f=function(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ');}, t=f(typed); if(!t)return {ok:false,kind:'empty',empty:true}; for(var i=0;i<alts.length;i++){ if(f(alts[i])===t) return {ok:true,kind:'exact',exact:true,clean:true,want:alts[i]}; } return {ok:false,kind:'bad',want:alts[0]}; },
    answer:function(){return null;}, confirm:function(){return null;}, isDue:function(){return false;}, stable:function(){return false;}, badge:function(){return '';}, info:function(){return {stage:'new',label:'',lv:0};}};
  function okText(res){ return !res.clean?'⚠ 字母都对，但标准写法是 <b>'+esc(res.want)+'</b>（空格或撇号有误，本次不计入掌握）':(res.kind==='variant'?'✓ 正确（英式 / 美式拼写均可）':'✓ 正确'); }
  function planText(r){ return r&&r.text?'<div style="font-size:12.5px;color:var(--soft);margin-top:6px">📅 '+esc(r.text)+'</div>':''; }
  function nbItem(e){ return {w:e.w, tr:e.tr, ph:e.ph, ex:e.ex, alts:e.w.split(/\s*\/\s*/).filter(Boolean), src:'notebook'}; }
  // for the error diagnosis: is the typed text a word, one of my own words, or a homophone?
  var DX={
    isWord:function(w){ return !!look(w); },
    isKnown:function(w){ for(var i=0;i<NB.length;i++){ if((NB[i].w||'').toLowerCase()===w) return true; } return false; },
    sameSound:function(a,b){ var x=get(a), y=get(b); return !!(a!==b&&x&&y&&x.ph&&x.ph===y.ph); }
  };
  var homShown=false;
  // due words first, then never-tested ones, then the rest — each group shuffled
  function reviewOrder(order,track){

  $('xans').addEventListener('keydown',function(ev){ if(window.__CUSTOM_SHORTCUTS__)return; if(ev.key==='Enter'&&!ev.isComposing&&ev.keyCode!==229&&!ev.repeat){ ev.preventDefault(); xSubmit(); } });
  $('xans').addEventListener('input',xSave);
  $('xclose').onclick=function(){ xSave(); stopRec(true); $('xov').classList.remove('show'); keepAwake(false); try{speechSynthesis.cancel();}catch(e){} X=null; drainPull(); };
  $('xov').addEventListener('click',function(ev){ if(ev.target===$('xov')) $('xclose').click(); });
  window.addEventListener('pagehide',function(){ stopRec(true); });

  /* live refresh after a sync pull — see the deck pages for why this is required.
     dorder indexes into NB, so defer while a review/dictation overlay is open. */
  var _pullPending=false;
  // #mov (选择题) holds INDICES into NB via morder — swapping NB mid-quiz would silently
  // change the question under the user, so every overlay must gate the rehydrate.
  function overlayOpen(){ return $('ov').classList.contains('show')||$('dov').classList.contains('show')||$('mov').classList.contains('show')||$('xov').classList.contains('show'); }
  function rehydrateFromStorage(){
    if(overlayOpen()){ _pullPending=true; return; }
    try{ var n=JSON.parse(localStorage.getItem('ielts_nb')); if(n) NB=n; }catch(e){}
    try{ var d=JSON.parse(localStorage.getItem('ielts_nb_del')); if(d) DEL=d; }catch(e){}
    render();
  }
  function drainPull(){ if(_pullPending){ _pullPending=false; rehydrateFromStorage(); } }
  window.addEventListener('ielts:pulled',rehydrateFromStorage);

  render();
  if(!window.DICT){ $('hint').textContent='⚠️ 词典未加载（dict.js 缺失），仍可手动记词与发音。'; }
</script>
</body>
</html>
