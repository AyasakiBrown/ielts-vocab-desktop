<!DOCTYPE html>
<html lang="zh">
<head>
<script src="mistakes.js"></script>
<script src="srs.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生词本</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --soft:#6b7280; --line:#e5e7eb; --accent:#2563eb; --accent2:#0ea5a4; --good:#16a34a; --bad:#dc2626; --chip:#eef2ff; --track:#eef0f3; --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05); }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0f1320; --card:#171c2b; --ink:#e8ecf3; --soft:#9aa3b2; --line:#262d40; --accent:#5b8cff; --accent2:#2dd4bf; --good:#34d399; --bad:#f87171; --chip:#1e2740; --track:#222a3d; --shadow:0 1px 3px rgba(0,0,0,.4); } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:30px 18px 60px}
  h1{margin:0 0 3px;font-size:23px}
  .sub{color:var(--soft);font-size:12.5px;margin:0 0 18px}
  .addbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5}
  .row{display:flex;gap:8px;align-items:center}
  input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:38px}
  .btn{border:none;border-radius:9px;padding:9px 14px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .ghosti{background:transparent;border:none;cursor:pointer;color:var(--soft);font-size:17px;padding:2px 5px}
  .hint{font-size:11.5px;color:var(--soft);margin-top:7px}
  .prev{margin-top:11px;border-top:1px dashed var(--line);padding-top:11px;display:none}
  .prev.show{display:block}
  .ph{color:var(--accent2);font-size:13px}
  .tools{display:flex;gap:8px;align-items:center;margin:18px 2px 10px;flex-wrap:wrap}
  .tools .count{color:var(--soft);font-size:12.5px;margin-right:auto}
  .search{flex:1;min-width:140px}
  .catpractice{width:100%;display:grid;gap:7px;margin-top:2px;padding-top:10px;border-top:1px solid var(--line)}
  .cprow{display:flex;gap:6px;align-items:center}
  .cptitle{width:94px;flex:0 0 94px;font-size:12px;font-weight:650;color:var(--soft)}
  .cprow .btn{flex:1}
  @media(max-width:480px){.cptitle{width:82px;flex-basis:82px}.cprow .btn{padding-left:6px;padding-right:6px}}
  .item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px}
  .item .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .item .w{font-size:17px;font-weight:650}
  .item .meta{margin-left:auto;display:flex;gap:4px;align-items:center}
  .tr{margin:7px 0 0;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .tr[contenteditable]:focus{outline:1px solid var(--accent);border-radius:6px;padding:2px 4px}
  .exrow{margin-top:7px}
  .ex{font-size:12.5px;color:var(--soft)}
  .tag{display:inline-block;background:var(--chip);color:var(--accent);font-size:11px;padding:1px 8px;border-radius:999px}
  .pos{display:inline-block;background:var(--chip);color:var(--accent);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.3px;white-space:nowrap;vertical-align:middle}
  .lwtag{display:inline-block;background:rgba(14,165,164,.14);color:var(--accent2);font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.lw.on{color:var(--accent2)}
  .btn.sm.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .lwtoggle{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--ink);cursor:pointer;user-select:none}
  .lwtoggle input{width:auto;accent-color:var(--accent2)}
  .rwtag{display:inline-block;background:rgba(139,92,246,.16);color:#8b5cf6;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.rw.on{color:#8b5cf6}
  .rwtoggle input{accent-color:#8b5cf6}
  .wwtag{display:inline-block;background:rgba(245,158,11,.16);color:#d97706;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.ww.on{color:#d97706}
  .wwtoggle input{accent-color:#d97706}
  .swtag{display:inline-block;background:rgba(236,72,153,.14);color:#db2777;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .ghosti.sw.on{color:#db2777}
  .swtoggle input{accent-color:#db2777}
  .need{color:var(--bad);font-size:11.5px}
  .old{margin:0 0 9px;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--good) 9%,var(--card));border:1px solid color-mix(in srgb,var(--good) 35%,var(--line));font-size:13px;line-height:1.55}
  .old .oh{font-weight:650;color:var(--good)}
  .old .otr{white-space:pre-wrap;margin-top:3px}
  .old .oex{color:var(--soft);font-size:12.5px;margin-top:2px}
  .en{margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--soft)}
  .en .enl{display:block}
  .en .enp{font-style:italic;color:var(--accent2);margin-right:4px}
  .en summary{cursor:pointer;list-style:none;color:var(--accent);font-size:12px}
  .en summary::-webkit-details-marker{display:none}
  .sug{margin-top:7px;font-size:12px;color:var(--soft);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .sugw{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}
  .sugw:hover{border-color:var(--accent)}
  .item.flash{outline:2px solid var(--good);outline-offset:1px}
  [hidden]{display:none!important}
  @media (max-height:700px){ .addbox{position:static} }
  .empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:13px}
  /* review overlay */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .ov.show{display:flex}
  .rc{background:var(--card);border-radius:18px;padding:26px 22px;width:min(440px,90vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .rc .rw{font-size:30px;font-weight:700;margin:6px 0}
  .rc .rph{color:var(--accent2);font-size:15px;min-height:18px}
  .rc .rtr{margin:16px 0;font-size:15px;line-height:1.6;white-space:pre-wrap;min-height:40px;color:var(--ink)}
  .rc .rtr.hidden{filter:blur(7px)}
  .rc .nav{display:flex;gap:8px;justify-content:center;margin-top:18px}
  .rc .prog{color:var(--soft);font-size:12px;margin-top:12px}
  .mcchoices{display:grid;gap:9px;margin-top:18px;text-align:left}
  .mcopt{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;line-height:1.45;cursor:pointer}
  .mcopt:hover{border-color:var(--accent)}
  .mcopt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card));color:var(--good)}
  .mcopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad)}
  .mcopt:disabled{cursor:default}
body{overscroll-behavior-y:contain}
button{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div class="wrap">
  <h1>📒 生词本</h1>
  <p class="sub">练习里遇到不会的词，敲进来回车即可 —— 自动配上音标、中文释义和发音（离线词典 5.8 万词）。数据存本地。</p>

  <div class="addbox">
    <div class="row">
      <input id="w" placeholder="输入生词，回车添加（如 mitigate）" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <button class="btn" id="add">添加</button>
    </div>
    <div class="sug" id="psug" hidden></div>
    <div class="prev" id="prev">
      <div class="row" style="gap:10px"><b id="pw"></b><span class="ph" id="pph"></span><span id="pemo" style="font-size:22px"></span><button class="ghosti" id="psay" title="朗读">🔊</button></div>
      <div class="old" id="pold" hidden></div>
      <textarea id="ptr" placeholder="中文释义（自动填入，可改）"></textarea>
      <div class="en" id="pen" hidden></div>
      <div class="row" style="margin-top:7px"><input id="pex" placeholder="例句 / 语境（可选）"></div>
      <div class="row" style="margin-top:7px"><input id="ptag" placeholder="来源 / 标签，如 C18T2 听力（可选）"></div>
    </div>
    <div class="hint" id="hint">提示：直接回车＝查词典并加入；词典没有的词也会加入，自己补释义即可。</div>
    <label class="lwtoggle"><input type="checkbox" id="plw"> 🎧 标记为「听力错词」——雅思听力里听错 / 拼错的词，可单独听写</label>
    <label class="lwtoggle rwtoggle"><input type="checkbox" id="prw"> 📖 标记为「阅读错词」——雅思阅读里不认识 / 弄错的词，可单独听写</label>
    <label class="lwtoggle wwtoggle"><input type="checkbox" id="pww"> 📝 标记为「写作生词」——雅思写作需要积累 / 运用的词</label>
    <label class="lwtoggle swtoggle"><input type="checkbox" id="psw"> 🗣️ 标记为「口语生词」——雅思口语需要积累 / 运用的词</label>
  </div>

  <p class="sub">练习进度自动保存；中途退出后，再点原来的练习入口即可接着上次继续。每个词会记录下次复习日：听写、选择题会先出到期的词，答错的词隔几题重测。</p>
  <div class="tools">
    <span class="count" id="count"></span>
    <input class="search" id="search" placeholder="🔎 搜索生词 / 释义">
    <button class="btn alt sm" id="onlyLW" title="只看听力错词">🎧 听力错词</button>
    <button class="btn alt sm" id="onlyRW" title="只看阅读错词">📖 阅读错词</button>
    <button class="btn alt sm" id="onlyWW" title="只看写作生词">📝 写作生词</button>
    <button class="btn alt sm" id="onlySW" title="只看口语生词">🗣️ 口语生词</button>
    <button class="btn alt sm" id="dictate">✍️ 听写</button>
    <button class="btn alt sm" id="review">🎴 复习</button>
    <button class="btn alt sm" id="export">⬇️ 导出</button>
    <button class="btn sm" id="upgradeTr" hidden title="只更新还是词典原文的释义；你自己改过的不动">📚 补全释义</button>
    <div class="catpractice" aria-label="分类专项练习">
      <div class="cprow"><span class="cptitle">🎧 听力错词</span><button class="btn alt sm" id="dictateLW" title="只听写标记为听力错词的词">听写</button></div>
      <div class="cprow"><span class="cptitle">📖 阅读错词</span><button class="btn alt sm" id="dictateRW">听写</button><button class="btn alt sm" id="reviewRW">意思抽查</button><button class="btn alt sm" id="quizRW">选择题</button></div>
      <div class="cprow"><span class="cptitle">📝 写作生词</span><button class="btn alt sm" id="dictateWW">听写</button><button class="btn alt sm" id="reviewWW">意思抽查</button><button class="btn alt sm" id="quizWW">选择题</button></div>
      <div class="cprow"><span class="cptitle">🗣️ 口语生词</span><button class="btn alt sm" id="dictateSW">听写</button><button class="btn alt sm" id="reviewSW">意思抽查</button><button class="btn alt sm" id="quizSW">选择题</button></div>
    </div>
  </div>

  <div id="list"></div>
</div>

<div class="ov" id="ov">
  <div class="rc">
    <div id="remo" style="font-size:46px;min-height:52px;line-height:1"></div>
    <div class="rph" id="rph"></div>
    <div class="rw" id="rw"></div>
    <button class="btn alt sm" id="rsay">🔊 朗读</button>
    <div class="rtr hidden" id="rtr"></div>
    <button class="btn" id="rflip" style="margin-top:6px">显示释义</button>
    <div class="nav">
      <button class="btn alt" id="rprev">‹ 上一个</button>
      <button class="btn alt" id="rshuffle">🔀 打乱</button>
      <button class="btn alt" id="rnext">下一个 ›</button>
    </div>
    <div class="prog" id="rprog"></div>
    <button class="btn alt sm" id="rrestart" title="保留历史记录">↺ 从头重做</button>
    <button class="ghosti" id="rclose" style="margin-top:8px">关闭</button>
  </div>
</div>

<div class="ov" id="mov">
  <div class="rc">
    <div class="prog" id="mprog"></div>
    <div class="rph" id="mph"></div>
    <div class="rw" id="mword"></div>
    <button class="btn alt sm" id="msay">🔊 朗读</button>
    <div class="mcchoices" id="mchoices"></div>
    <div id="mfb" style="min-height:24px;margin-top:12px;font-size:14px;line-height:1.5"></div>
    <button class="btn" id="mnext" style="display:none;margin-top:10px">下一题 ›</button>
    <div class="prog" id="mscore"></div>
    <button class="btn alt sm" id="mrestart" title="保留历史记录">↺ 从头重做</button>
    <button class="ghosti" id="mclose" style="margin-top:8px">结束</button>
  </div>
</div>

<div class="ov" id="dov">
  <div class="rc">
    <div class="prog" id="dprog"></div>
    <div class="rtr" id="dtr" style="filter:none">提交答案后显示中文意思</div>
    <button class="btn alt sm" id="dsay">🔊 再听一次</button>
    <div class="row" style="margin-top:14px"><input id="dans" placeholder="听写：输入英文拼写" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    <div id="dfb" style="min-height:24px;margin-top:10px;font-size:15px"></div>
    <div class="nav"><button class="btn" id="dsubmit" data-base="提交">提交 (Enter)</button><button class="btn alt" id="dskip">跳过 ›</button></div>
    <div class="prog" id="dscore"></div>
    <button class="btn alt sm" id="drestart" title="保留历史记录">↺ 从头重做</button>
    <button class="ghosti" id="dclose" style="margin-top:8px">结束</button>
  </div>
</div>

<script src="dict.js"></script>
<script src="defs.js"></script>
<script src="emoji.js"></script>
<script src="images.js"></script>
<script>
  var $=function(id){return document.getElementById(id);};
  // Submit-button hint follows the user's shortcut settings (shortcuts.js); without
  // it (phone/PWA) the page's own Enter handler applies. A cleared binding shows no key.
  function submitHint(){ var S=window.IELTSShortcuts; if(!S) return ' (Enter)'; var k=S.label('submit'); return k?' ('+k+')':''; }
  function setSubmit(text){ var b=$('dsubmit'); if(!b) return; b.dataset.base=text; b.textContent=text+submitHint(); }
  window.addEventListener('ielts:shortcuts',function(){ var b=$('dsubmit'); if(b) b.textContent=(b.dataset.base||'提交')+submitHint(); });
  setSubmit('提交');
  var DICT=window.DICT||{};
  // Review ledger (srs.js), shared with the decks. The stub only keeps practice usable
  // if that script failed to load; it schedules nothing.
  var RV=window.IELTSReview||{live:false,
    grade:function(typed,alts){ var f=function(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ');}, t=f(typed); if(!t)return {ok:false,kind:'empty',empty:true}; for(var i=0;i<alts.length;i++){ if(f(alts[i])===t) return {ok:true,kind:'exact',exact:true,clean:true,want:alts[i]}; } return {ok:false,kind:'bad',want:alts[0]}; },
    answer:function(){return null;}, confirm:function(){return null;}, isDue:function(){return false;}, stable:function(){return false;}, badge:function(){return '';}, info:function(){return {stage:'new',label:'',lv:0};}};
  function okText(res){ return !res.clean?'⚠ 字母都对，但标准写法是 <b>'+esc(res.want)+'</b>（空格或撇号有误，本次不计入掌握）':(res.kind==='variant'?'✓ 正确（英式 / 美式拼写均可）':'✓ 正确'); }
  function planText(r){ return r&&r.text?'<div style="font-size:12.5px;color:var(--soft);margin-top:6px">📅 '+esc(r.text)+'</div>':''; }
  function nbItem(e){ return {w:e.w, tr:e.tr, ph:e.ph, ex:e.ex, alts:e.w.split(/\s*\/\s*/).filter(Boolean), src:'notebook'}; }
  // for the error diagnosis: is the typed text a word, one of my own words, or a homophone?
  var DX={
    isWord:function(w){ return !!look(w); },
    isKnown:function(w){ for(var i=0;i<NB.length;i++){ if((NB[i].w||'').toLowerCase()===w) return true; } return false; },
    sameSound:function(a,b){ var x=get(a), y=get(b); return !!(a!==b&&x&&y&&x.ph&&x.ph===y.ph); }
  };
  var homShown=false;
  // due words first, then never-tested ones, then the rest — each group shuffled
  function reviewOrder(order,track){
    var rank=function(i){ var w=NB[i].w; return RV.isDue(w,track)?0:(RV.info(w,track).stage==='new'?1:2); };
    var groups=[[],[],[]]; order.forEach(function(i){ groups[rank(i)].push(i); });
    groups.forEach(function(g){ for(var i=g.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=g[i];g[i]=g[j];g[j]=t; } });
    return groups[0].concat(groups[1],groups[2]);
  }
  // 错词隔几题再测
  function requeue(order,at){ var i=order[at]; if(order.indexOf(i,at+1)<0) order.splice(Math.min(order.length,at+4),0,i); }
  var CATS={
    lw:{emoji:'🎧',label:'听力错词'}, rw:{emoji:'📖',label:'阅读错词'},
    ww:{emoji:'📝',label:'写作生词'}, sw:{emoji:'🗣️',label:'口语生词'}
  };
  function catText(cat){ var c=CATS[cat]; return c?(c.emoji+' '+c.label):''; }
  /* ---------- storage ---------- */
  var NB=[], DEL={}, sessions={};
  try{ sessions=JSON.parse(localStorage.getItem('ielts_nb_sessions'))||{}; }catch(e){}
  function mergeSessions(incoming){
    Object.keys(incoming||{}).forEach(function(k){ if(!sessions[k]||(incoming[k].ts||0)>(sessions[k].ts||0)) sessions[k]=incoming[k]; });
  }
  try{ var ls=localStorage.getItem('ielts_nb'); if(ls) NB=JSON.parse(ls)||[]; }catch(e){}
  try{ DEL=JSON.parse(localStorage.getItem('ielts_nb_del'))||{}; }catch(e){}
  // deletion tombstones: {wLower: deletedAtTs}. A record older than its tombstone stays
  // dead everywhere; re-adding the word (fresh ts) legitimately resurrects it.
  (function(){ var cut=Date.now()-180*864e5; for(var k in DEL){ if(DEL[k]<cut) delete DEL[k]; } })();
  function tombed(e){ var k=(e&&e.w||'').toLowerCase(); return !!(DEL[k]&&((e.ts||0)<=DEL[k])); }
  try{ var b=window.__INITIAL_STATE__&&window.__INITIAL_STATE__.decks&&window.__INITIAL_STATE__.decks.notebook;
    if(b){ mergeSessions(b.sessions); var changed=false;
      var bdel=b.del||{}; for(var dk in bdel){ if((bdel[dk]||0)>(DEL[dk]||0)){ DEL[dk]=bdel[dk]; changed=true; } }
      var kept=NB.filter(function(e){return !tombed(e);}); if(kept.length!==NB.length){ NB=kept; changed=true; }
      if(b.list&&b.list.length){ var have={}; NB.forEach(function(e){ if(e&&e.w) have[e.w.toLowerCase()]=e; });
        b.list.forEach(function(e){
          if(!e||!e.w||tombed(e)) return; var k=e.w.toLowerCase(), o=have[k];
          if(!o){ NB.push(e); have[k]=e; changed=true; return; }
          var eu=e.ut||0, ou=o.ut||0;   // ut = last edit time: the newer edit wins
          if(eu>ou){ ['ph','tr','ex','tag','lw','rw','ww','sw','ut'].forEach(function(f){ if(f in e) o[f]=e[f]; }); changed=true; return; }
          ['ph','tr','ex','tag'].forEach(function(f){ if(!o[f]&&e[f]){o[f]=e[f];changed=true;} });
          if(eu===ou) ['lw','rw','ww','sw'].forEach(function(f){ if(e[f]&&!o[f]){o[f]=true;changed=true;} });
        });
      }
      if(changed) save();
    } }catch(e){}
  function save(){
    try{ localStorage.setItem('ielts_nb_sessions', JSON.stringify(sessions)); }catch(e){}
    try{ localStorage.setItem('ielts_nb', JSON.stringify(NB)); }catch(e){}
    try{ localStorage.setItem('ielts_nb_del', JSON.stringify(DEL)); }catch(e){}

    var s=sessions[kind+':'+cat];
    if(!s||!Array.isArray(s.words)||!Number.isInteger(s.idx)||s.idx<0||s.idx>s.words.length||(s.idx===s.words.length&&kind!=='quiz')) return null;
    var byWord=new Map(NB.map(function(e,i){return [e.w.toLowerCase(),i];}));
    var valid=function(w){var i=byWord.get(w);return i!==undefined&&(!cat||NB[i][cat])&&(kind!=='quiz'||(NB[i].tr||'').trim());};
    var words=s.words.filter(valid), idx=s.words.slice(0,s.idx).filter(valid).length;
    if(!words.length||(idx>=words.length&&kind!=='quiz')) return null;
    return Object.assign({},s,{order:words.map(function(w){return byWord.get(w);}),idx:idx});
  }
  function savePractice(){
    if($('ov').classList.contains('show')) checkpoint('review',rCat,rorder,ri);
    if($('mov').classList.contains('show')) checkpoint('quiz',mCat,morder,Math.min(morder.length,mi+(manswered?1:0)),{right:mright,wrong:mwrong});
    if($('dov').classList.contains('show')) checkpoint('dict',dCat,dorder,Math.min(dorder.length,di+($('dans').readOnly?1:0)),{right:dright,wrong:dwrong,draft:$('dans').readOnly?'':$('dans').value});
  }
  window.addEventListener('pagehide',savePractice);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')savePractice();});
  $('dans').addEventListener('input',savePractice);
  /* ---------- review (flashcards) ---------- */
  var rorder=[], ri=0, rCat='';
  function shuffleReview(){
    for(var i=rorder.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=rorder[i];rorder[i]=rorder[j];rorder[j]=t; }
  }
  function openReview(cat){
    rCat=cat||''; rorder=[];
    for(var i=0;i<NB.length;i++){ if(!rCat || NB[i][rCat]) rorder.push(i); }
    if(!rorder.length){ alert(rCat?('还没有标记「'+catText(rCat)+'」的词。\n先标记后，再来抽查意思。'):'生词本还是空的'); return; }
    if(rCat) shuffleReview();
    var saved=resumePractice('review',rCat); ri=0; if(saved){rorder=saved.order;ri=saved.idx;}
    $('ov').classList.add('show'); keepAwake(true); showCard();
  }
  function showCard(){
    var e=NB[rorder[ri]]; if(!e) return;
    $('rw').textContent=e.w; $('rph').textContent=e.ph?('['+e.ph+']'):''; var rim=pic(e.w); $('remo').innerHTML = rim?('<img src="'+rim+'" style="width:130px;height:130px;border-radius:12px;object-fit:cover">'):(emo(e.w)||'');
    $('rtr').innerHTML=posBadge(e)+esc(e.tr||'（无释义）'); $('rtr').classList.add('hidden'); $('rflip').textContent='显示释义';
    $('rprog').textContent=(rCat?(catText(rCat)+'　'):'')+(ri+1)+' / '+rorder.length;
    checkpoint('review',rCat,rorder,ri); speak(e.w);
  }
  $('rrestart').onclick=function(){ri=0;showCard();};
  function uniq(order){ return order.filter(function(x,i){ return order.indexOf(x)===i; }); }   // drop re-test copies
  $('mrestart').onclick=function(){morder=uniq(morder);mi=0;mright=0;mwrong=[];mShow();};
  $('drestart').onclick=function(){dorder=uniq(dorder);di=0;dright=0;dwrong=[];dToggle(true);dShow();};
  $('review').onclick=function(){ openReview(''); };
  $('reviewRW').onclick=function(){ openReview('rw'); };
  $('reviewWW').onclick=function(){ openReview('ww'); };
  $('reviewSW').onclick=function(){ openReview('sw'); };
  $('rclose').onclick=function(){ savePractice(); $('ov').classList.remove('show'); keepAwake(false); speechSynthesis&&speechSynthesis.cancel(); drainPull(); };
  $('rflip').onclick=function(){ var t=$('rtr'); if(t.classList.contains('hidden')){ t.classList.remove('hidden'); this.textContent='隐藏'; } else { t.classList.add('hidden'); this.textContent='显示释义'; } };
  $('rsay').onclick=function(){ speak(NB[rorder[ri]].w); };
  $('rnext').onclick=function(){ ri=(ri+1)%rorder.length; showCard(); };
  $('rprev').onclick=function(){ ri=(ri-1+rorder.length)%rorder.length; showCard(); };
  $('rshuffle').onclick=function(){ shuffleReview(); ri=0; showCard(); };
  $('ov').addEventListener('click', function(ev){ if(ev.target===$('ov')) $('rclose').click(); });

  /* ---------- category meaning multiple choice ---------- */
  var morder=[], mi=0, mright=0, mwrong=[], manswered=false, moptions=[], mCat='rw';
  function shuffleArray(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }
  function openQuiz(cat,fresh){
    mCat=cat||'rw';
    morder=[];
    var meanings={}, distinct=0;
    for(var i=0;i<NB.length;i++){
      var tr=(NB[i].tr||'').trim();
      if(tr&&!meanings[tr]){ meanings[tr]=1; distinct++; }
      if(NB[i][mCat]&&tr) morder.push(i);
    }
    if(!morder.length){ alert('还没有带释义的「'+catText(mCat)+'」。\n先标记并补上释义，再来做选择题。'); return; }
    if(distinct<2){ alert('至少需要 2 个不同释义的生词，才能生成选择题选项。'); return; }
    morder=reviewOrder(morder,'m'); mi=0; mright=0; mwrong=[]; var saved=fresh?null:resumePractice('quiz',mCat); if(saved){morder=saved.order;mi=saved.idx;mright=saved.right||0;mwrong=saved.wrong||[];} $('mov').classList.add('show'); keepAwake(true); mShow();
  }
  function mShow(){
    var e=NB[morder[mi]]; if(!e){ mEnd(); return; }
    manswered=false; $('mword').textContent=e.w; $('mph').textContent=e.ph?('['+e.ph+']'):'';
    $('mprog').textContent=catText(mCat)+'　第 '+(mi+1)+' / '+morder.length;
    var correct=(e.tr||'').trim(), seen={}; seen[correct]=1; var distractors=[];
    for(var i=0;i<NB.length;i++){ var tr=(NB[i].tr||'').trim(); if(tr&&!seen[tr]){ seen[tr]=1; distractors.push(tr); } }
    shuffleArray(distractors); moptions=[correct].concat(distractors.slice(0,3)); shuffleArray(moptions);
    $('mchoices').innerHTML=moptions.map(function(tr,i){ return '<button class="mcopt" data-i="'+i+'">'+esc(tr)+'</button>'; }).join('');
    $('mfb').textContent=''; $('mnext').style.display='none'; $('mnext').textContent=(mi+1===morder.length)?'查看结果':'下一题 ›';
    checkpoint('quiz',mCat,morder,mi,{right:mright,wrong:mwrong});
    $('msay').style.display=''; $('mscore').textContent='✓ '+mright+'　已答 '+mi+' / '+morder.length; speak(e.w);
  }
  function mCheck(index){
    if(manswered) return; var e=NB[morder[mi]], correct=(e.tr||'').trim(); manswered=true;
    var buttons=$('mchoices').querySelectorAll('.mcopt'), ok=moptions[index]===correct;
    for(var i=0;i<buttons.length;i++){ buttons[i].disabled=true; if(moptions[i]===correct) buttons[i].classList.add('correct'); }
    if(!ok){
      var mixed=null; for(var j=0;j<NB.length;j++){ if((NB[j].tr||'').trim()===moptions[index]){ mixed={w:NB[j].w,zh:moptions[index]}; break; } }
      mwrong.push(e.w.toLowerCase());IELTSMistakes.record(e,'notebook','quiz',moptions[index],mixed?{alt:mixed}:null);requeue(morder,mi);
    }
    var plan=planText(RV.answer(nbItem(e),'m',ok?'ok':'bad'));
    if(ok){ mright++; $('mfb').innerHTML='<span style="color:var(--good)">✓ 回答正确</span>'+plan; }
    else { if(buttons[index]) buttons[index].classList.add('wrong'); $('mfb').innerHTML='<span style="color:var(--bad)">✗ 正确答案：</span>'+esc(correct)+plan; }
    $('mscore').textContent='✓ '+mright+'　已答 '+(mi+1)+' / '+morder.length; $('mnext').style.display=''; savePractice();
  }
  function mEnd(){
    manswered=false;
    checkpoint('quiz',mCat,morder,morder.length,{right:mright,wrong:mwrong});
    var total=morder.length, pct=total?Math.round(mright/total*100):0;
    $('mprog').textContent=''; $('mph').textContent=''; $('mword').textContent='选择题完成 🎉'; $('msay').style.display='none'; $('mchoices').innerHTML='';
    $('mfb').innerHTML='得分 <b>'+mright+' / '+total+'</b>（'+pct+'%）'+
      (mwrong.length?' <button class="btn sm" id="mretryWrong">重练本轮错题（'+mwrong.length+'）</button>':'')+
      ' <button class="btn alt sm" id="mredo">再做一次</button>';
    $('mnext').style.display='none'; $('mscore').textContent='';
    try{speechSynthesis.cancel();}catch(e){}
    if($('mretryWrong')) $('mretryWrong').onclick=function(){
      var words=new Set(mwrong), retry=[];
      NB.forEach(function(e,i){if(words.has(e.w.toLowerCase())&&e[mCat]&&(e.tr||'').trim())retry.push(i);});
      if(!retry.length){alert('本轮错词已被移除或不再属于当前分类。');return;}
      morder=retry;mi=0;mright=0;mwrong=[];mShow();
    };
    $('mredo').onclick=function(){ openQuiz(mCat,true); };
  }
  $('quizRW').onclick=function(){ openQuiz('rw'); };
  $('quizWW').onclick=function(){ openQuiz('ww'); };
  $('quizSW').onclick=function(){ openQuiz('sw'); };
  $('msay').onclick=function(){ var e=NB[morder[mi]]; if(e) speak(e.w); };
  $('mchoices').addEventListener('click',function(ev){ var b=ev.target.closest('.mcopt'); if(b) mCheck(parseInt(b.getAttribute('data-i'),10)); });
  $('mnext').onclick=function(){ mi++; if(mi>=morder.length) mEnd(); else mShow(); };
  $('mclose').onclick=function(){ savePractice(); $('mov').classList.remove('show'); keepAwake(false); try{speechSynthesis.cancel();}catch(e){} drainPull(); };
  $('mov').addEventListener('click',function(ev){ if(ev.target===$('mov')) $('mclose').click(); });

  /* ---------- dictation (听写) ---------- */
  var dorder=[], di=0, dright=0, dwrong=[], dCat='';
  function dToggle(show){ ['dans','dsay','dsubmit','dskip'].forEach(function(id){ $(id).style.display=show?'':'none'; }); }
  function openDictate(cat){
    dCat=cat||'';
    dorder=[]; for(var i=0;i<NB.length;i++){ if(!dCat || NB[i][dCat]) dorder.push(i); }
    if(!dorder.length){ alert(dCat?('还没有标记「'+catText(dCat)+'」的词。\n先标记后，再来专门听写。'):'生词本还是空的'); return; }
    dorder=reviewOrder(dorder,'d');
    di=0; dright=0; dwrong=[]; var saved=resumePractice('dict',dCat); if(saved){dorder=saved.order;di=saved.idx;dright=saved.right||0;dwrong=saved.wrong||[];} dToggle(true); $('dov').classList.add('show'); keepAwake(true); dShow(); if(saved&&saved.draft){$('dans').value=saved.draft;savePractice();}
  }
  function dShow(){
    var e=NB[dorder[di]]; if(!e){ dEnd(); return; }
    $('dprog').textContent=(dCat?(catText(dCat)+'　'):'')+'第 '+(di+1)+' / '+dorder.length;
    var known=RV.info(e.w).rec;
    homShown=!!(known&&known.hom);           // homophones cannot be told apart by ear: show the meaning first
    if(homShown) $('dtr').innerHTML='同音词，按这个意思拼写：'+posBadge(e)+esc(e.tr||'（暂无中文释义）'); else $('dtr').textContent='提交答案后显示中文意思';
    $('dans').value=''; $('dans').readOnly=false; $('dfb').textContent=''; setSubmit('提交');
    $('dscore').textContent='✓ '+dright+'　✗ '+dwrong.length;
    checkpoint('dict',dCat,dorder,di,{right:dright,wrong:dwrong,draft:''});
    setTimeout(function(){ try{$('dans').focus();}catch(e){} },60); speak(e.w);
  }
  function dCheck(){
    var e=NB[dorder[di]]; if(!e) return;
    if($('dans').readOnly){ dNext(); return; }
    // British and American spellings both pass; a spacing/apostrophe slip is accepted
    // once but never counts as remembered.
    var res=RV.grade($('dans').value, nbItem(e).alts);
    if(res.empty){ try{$('dans').focus();}catch(x){} return; }
    var ok=res.ok, dg=(!ok&&RV.diagnose)?RV.diagnose($('dans').value,nbItem(e).alts,DX):null;
    if(dg&&dg.cause==='homophone'&&!homShown){   // ambiguous test, not a mistake: show the meaning and ask again
      homShown=true; RV.noteHomophone(nbItem(e));
      $('dtr').innerHTML='同音词，按这个意思拼写：'+posBadge(e)+esc(e.tr||'（暂无中文释义）');
      $('dfb').innerHTML='<span style="color:var(--soft)">「'+esc($('dans').value)+'」和这个词读音相同，只靠听分不出，这次不计错。请按上面的释义再写一次。</span>';
      $('dans').value=''; try{$('dans').focus();}catch(x){} return;
    }
    if(!ok){ IELTSMistakes.record(e,'notebook','dict',$('dans').value); requeue(dorder,di); }
    var plan=(dg?'<div style="font-size:13px;margin-top:6px;line-height:1.6">'+RV.explain(dg)+'</div>':'')+planText(RV.answer(nbItem(e),'d',ok?(res.clean?'ok':'soft'):'bad'));
    if(ok){ dright++; $('dfb').innerHTML='<span style="color:var('+(res.clean?'--good':'--bad')+')">'+okText(res)+'</span> '+mediaInline(e.w,30)+plan; }
    else { dwrong.push(e.id); $('dfb').innerHTML='<span style="color:var(--bad)">✗ 应为 <b>'+esc(e.w)+'</b></span> '+mediaInline(e.w,30)+plan; }
    $('dtr').innerHTML=posBadge(e)+esc(e.tr||'（暂无中文释义）');
    $('dans').readOnly=true; setSubmit('下一个');
    $('dscore').textContent='✓ '+dright+'　✗ '+dwrong.length; savePractice(); speak(e.w);
  }
  function dNext(){ di++; if(di>=dorder.length) dEnd(); else dShow(); }
  function dEnd(){
    checkpoint('dict',dCat,dorder,dorder.length,{right:dright,wrong:dwrong});
    var total=dorder.length, pct=total?Math.round(dright/total*100):0;
    $('dprog').textContent=''; $('dtr').textContent='听写完成 🎉'; dToggle(false);
    $('dfb').innerHTML='得分 <b>'+dright+' / '+total+'</b>（'+pct+'%）'+(dwrong.length?' <button class="btn sm" id="dredo">重练错词 '+dwrong.length+'</button>':' 全对，漂亮！')+
      '<div style="font-size:12.5px;color:var(--soft);margin-top:8px">当天答对只算当次纠正；隔天答对才会延长复习间隔。到期的词会出现在首页「📅 今日复习」。</div>';
    var rb=$('dredo'); if(rb) rb.onclick=function(){ var ids=dwrong.slice(); dorder=[]; for(var i=0;i<NB.length;i++) if(ids.indexOf(NB[i].id)>=0) dorder.push(i); di=0;dright=0;dwrong=[]; dToggle(true); dShow(); };
  }
  $('dictate').onclick=function(){ openDictate(''); };
  $('dictateLW').onclick=function(){ openDictate('lw'); };
  $('dictateRW').onclick=function(){ openDictate('rw'); };
  $('dictateWW').onclick=function(){ openDictate('ww'); };
  $('dictateSW').onclick=function(){ openDictate('sw'); };
  $('dsay').onclick=function(){ speak(NB[dorder[di]].w); };
  $('dsubmit').onclick=dCheck;
  $('dskip').onclick=function(){ if(!$('dans').readOnly){ dwrong.push(NB[dorder[di]].id); $('dscore').textContent='✓ '+dright+'　✗ '+dwrong.length; } dNext(); };
  $('dans').addEventListener('keydown', function(ev){ if(window.__CUSTOM_SHORTCUTS__)return; if(ev.key==='Enter' && !ev.isComposing && ev.keyCode!==229 && !ev.repeat){ ev.preventDefault(); dCheck(); } });
  $('dclose').onclick=function(){ savePractice(); $('dov').classList.remove('show'); dToggle(true); keepAwake(false); try{speechSynthesis.cancel();}catch(e){} drainPull(); };
  $('dov').addEventListener('click', function(ev){ if(ev.target===$('dov')) $('dclose').click(); });

  /* live refresh after a sync pull — see the deck pages for why this is required.
     dorder indexes into NB, so defer while a review/dictation overlay is open. */
  var _pullPending=false;
  // #mov (选择题) holds INDICES into NB via morder — swapping NB mid-quiz would silently
  // change the question under the user, so every overlay must gate the rehydrate.
  function overlayOpen(){ return $('ov').classList.contains('show')||$('dov').classList.contains('show')||$('mov').classList.contains('show'); }
  function rehydrateFromStorage(){
    if(overlayOpen()){ _pullPending=true; return; }
    try{ var n=JSON.parse(localStorage.getItem('ielts_nb')); if(n) NB=n; }catch(e){}
    try{ var d=JSON.parse(localStorage.getItem('ielts_nb_del')); if(d) DEL=d; }catch(e){}
    render();
  }
  function drainPull(){ if(_pullPending){ _pullPending=false; rehydrateFromStorage(); } }
  window.addEventListener('ielts:pulled',rehydrateFromStorage);

  render();
  if(!window.DICT){ $('hint').textContent='⚠️ 词典未加载（dict.js 缺失），仍可手动记词与发音。'; }
</script>
</body>
